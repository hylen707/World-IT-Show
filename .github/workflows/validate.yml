name: Evidence and reproducibility checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate evidence links and original-source integrity
        run: python tools/validate.py
      - name: Check analytical output reproducibility
        run: python tools/analyze.py --check
      - name: Exercise rejection paths and model boundaries
        run: python -m unittest discover -s tests -v
